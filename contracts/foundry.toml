[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = true
bytecode_hash = "none"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/v4-core/=lib/v4-core/",
]
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 120
fail_on_revert = true

[profile.ci.invariant]
runs = 1024
depth = 200

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"


[lint]
lint_on_build = false
[fmt]
line_length = 120
